[project]
name = "apple-reminders-mcp"
version = "0.1.0"
description = "MCP server exposing Apple Reminders (macOS) via AppleScript"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
apple-reminders-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
